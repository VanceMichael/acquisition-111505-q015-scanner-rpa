<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>借展装箱台</title><style>body{font:18px sans-serif;padding:2rem}input,select,button{font:inherit;margin:.5rem}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:.5rem}</style><h1>借展装箱台</h1><label>当前箱号<select id="box"><option>box-a</option><option>box-b</option></select></label><label>操作员备注<input id="note"></label><section id="scan-area"></section><p role="status" id="status">等待扫码</p><table><thead><tr><th>物件编号</th><th>累计数量</th><th>扫码消息</th></tr></thead><tbody id="rows"></tbody></table><script>
const box=document.querySelector('#box'), area=document.querySelector('#scan-area'), rows=document.querySelector('#rows'), status=document.querySelector('#status');let message='manual-1';
function input(){area.innerHTML='<label>物件扫码<input aria-label="物件扫码" autocomplete="off"></label><label>数量<input type="number" value="1" aria-label="数量"></label>';area.querySelector('[aria-label="物件扫码"]').addEventListener('keydown',async event=>{if(event.key!=='Enter')return;event.preventDefault();const code=event.currentTarget.value;const activeBox=box.value;const messageId=window.confirmedScanMessage||message;status.textContent='正在查找物件';area.innerHTML='<label>数量<input type="number" value="1" aria-label="数量"></label>';const reply=await fetch('/api/box',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,boxId:activeBox,messageId})});const result=await reply.json();status.textContent=result.error||'已登记';input();await refresh();});}
async function refresh(){const result=await(await fetch('/api/box?boxId='+encodeURIComponent(box.value))).json();rows.replaceChildren();for(const row of result.rows){const element=document.createElement('tr');element.dataset.scanMessage=row.lastMessage;const item=document.createElement('td');item.textContent=row.item;const count=document.createElement('td');const editor=document.createElement('input');editor.type='number';editor.value=row.quantity;editor.setAttribute('aria-label',row.item+' 数量');editor.addEventListener('change',async()=>{await fetch('/api/manual-change',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({boxId:box.value,item:row.item,quantity:Number(editor.value)})});await refresh();});count.append(editor);const receipt=document.createElement('td');receipt.textContent=row.lastMessage;element.append(item,count,receipt);rows.append(element);}}
box.addEventListener('change',async()=>{status.textContent='操作员已换箱';input();await refresh();});input();refresh();
</script></html>
